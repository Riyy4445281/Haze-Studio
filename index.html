<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haze Studio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#27343e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--sky1:#5e7686;--sky2:#7d93a1;--grass:#3f6340;--glass:rgba(255,255,255,.14);--edge:rgba(255,255,255,.34);--ink:#fff;--soft:rgba(255,255,255,.72);--blue:#6ea8ff;--shade:rgba(10,16,22,.36);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#27343e;--sky2:#3a4b57;--grass:#1f3a2a;--shade:rgba(0,0,0,.42);color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#27343e;--sky2:#3a4b57;--grass:#1f3a2a;--shade:rgba(0,0,0,.42);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:var(--ink);font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sky1);-webkit-user-select:none;user-select:none}
.bg{position:fixed;inset:-40px;z-index:-2;background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--grass));background-size:cover;background-position:center;filter:blur(26px) saturate(1.1)}
.shade{position:fixed;inset:0;z-index:-1;background:var(--shade)}
.app{display:flex;flex-direction:column;height:100%;max-width:700px;margin-inline:auto;padding:8px;gap:8px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:22px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.top{display:flex;align-items:center;gap:0;padding:3px 6px}
.sp{flex:1}
.ic{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:var(--ink);border-radius:50%;cursor:pointer;flex:none}
.ic svg,.tb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic:disabled{opacity:.35}
.stage{position:relative;flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(0,0,0,.28)}
#view{width:100%;height:100%;object-fit:contain}
#hist{position:absolute;top:8px;left:8px;right:8px;width:calc(100% - 16px);height:44px;border-radius:10px;background:rgba(30,30,30,.45);pointer-events:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--soft)}
.sheet{max-height:40%;overflow-y:auto;padding:6px 14px 10px}
.sub{display:flex;gap:2px;margin:0 -8px 2px;overflow-x:auto}
.tb{flex:1;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;background:none;border:0;border-radius:14px;color:var(--soft);font:inherit;font-size:.78rem;cursor:pointer}
.tb.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.dock{display:flex;justify-content:space-around;padding:5px}
.dock .tb{max-width:110px}
.dock .tb.on{background:var(--blue);color:#06101f;box-shadow:none}
h2{font-size:1.05rem;font-weight:600;margin:6px 0 2px}
.row{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:8px}
.row .lb{color:var(--soft);cursor:pointer;font-size:.9rem;padding:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums}
.sl{position:relative;height:38px;margin:0 10px;touch-action:pan-y;cursor:pointer;outline-offset:6px}
.sl::before{content:"";position:absolute;left:0;right:0;top:18px;height:2px;background:rgba(255,255,255,.55);border-radius:2px}
.sl i{position:absolute;top:9px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
.chip{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:8px 16px;min-height:42px;cursor:pointer}
.chip.on{background:var(--blue);color:#06101f;border-color:transparent}
#note{margin:6px 0 0;color:var(--soft);font-size:.85rem;-webkit-user-select:text;user-select:text}
#out{display:none;max-width:100%;border-radius:12px;margin-top:8px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="shade"></div>
<div class="app" id="app">
  <header class="top glass">
    <label class="ic" for="file" role="button" aria-label="Open photo" data-ic="image"></label>
    <input id="file" type="file" accept="image/*" hidden>
    <button class="ic" id="un" aria-label="Back one step" data-ic="undo" disabled></button>
    <button class="ic" id="re" aria-label="Forward one step" data-ic="redo" disabled></button>
    <button class="ic" id="rs" aria-label="Reset all edits" data-ic="reset" disabled></button>
    <span class="sp"></span>
    <button class="ic" id="cmp" aria-label="Hold to compare" data-ic="clock" disabled></button>
    <button class="ic" id="help" aria-label="Help" data-ic="help"></button>
    <button class="ic" id="save" aria-label="Save or share" data-ic="check" disabled></button>
  </header>
  <main class="stage glass">
    <canvas id="view" hidden></canvas>
    <canvas id="hist" width="256" height="44" hidden></canvas>
    <div id="empty">Open a photo from your phone to start editing. Nothing is uploaded; everything stays on your device.</div>
  </main>
  <section class="sheet glass">
    <div class="sub" id="sub"></div>
    <div id="panel"></div>
    <p id="note"></p>
    <img id="out" alt="Exported photo">
  </section>
  <nav class="dock glass" id="dock"></nav>
</div>
<script>
const $ = id => document.getElementById(id);
const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const IC = {
  image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
  reset:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  clock:'<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  wand:'<path d="M4 20L14 10"/><path d="M15 3v4M13 5h4M19 11v3M17.5 12.5h3"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  thermo:'<path d="M10 14V5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0z"/>',
  vig:'<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="5"/>',
  mask:'<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="3"/>',
  presets:'<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>',
  rotate:'<path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/>',
  sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
};
const svg = n => '<svg viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>';
document.querySelectorAll("[data-ic]").forEach(e => e.innerHTML = svg(e.dataset.ic));

const R = (k, n, lo = -100, hi = 100) => ["V", k, n, lo, hi, 0];
const TABS = {
  Light:{ic:"sun", head:"Basic", items:[R("exposure","Exposure"),R("contrast","Contrast"),R("highlights","Highlights"),R("shadows","Shadows"),R("whites","Whites"),R("blacks","Blacks")]},
  Color:{ic:"thermo", head:"White balance", items:[R("temp","Temp"),R("tint","Tint"),R("vibrance","Vibrance"),R("sat","Saturation")]},
  Effects:{ic:"vig", head:"Effects", items:[R("vig","Vignette"),R("grain","Grain",0,100),R("blur","Blur",0,100),R("vb","Vignette blur",0,100),R("warp","Warp"),R("wave","Wave",0,100)]},
  Mask:{ic:"mask"}
};
const PRESETS = {
  "Punchy":{contrast:25,vibrance:35,sat:10,shadows:20,highlights:-20},
  "Warm film":{temp:25,tint:5,contrast:-10,blacks:30,sat:-10,grain:25},
  "Faded":{blacks:45,contrast:-20,sat:-20,exposure:10},
  "Cool":{temp:-30,contrast:10,shadows:10},
  "Black and white":{sat:-100,contrast:25,shadows:10},
  "Moody":{exposure:-20,contrast:30,highlights:-30,sat:-15,vig:-40},
  "Soft glow":{contrast:-25,highlights:-30,shadows:35,whites:20,sat:-8}
};
const NEW = () => ({V:{}, L:{}, m:{t:"off",cx:.5,cy:.5,r:30,f:50,inv:0,er:0}, st:[], rot:0});
let S = NEW(), img = null, base = null, baseData = null, tab = "Light", mode = "edit", queued = false, showOrig = false, autoPre = null, autoB = null, H = [], hi = 0, K = 1;
const clone = o => structuredClone(o);

/* history */
function ui(){ $("un").disabled = hi < 1; $("re").disabled = hi >= H.length - 1; $("rs").disabled = !img; }
function commit(){
  if (!img || JSON.stringify(S) === JSON.stringify(H[hi])) return;
  H.length = hi + 1; H.push(clone(S)); if (H.length > 60) H.shift(); hi = H.length - 1; ui();
}
function go(n){
  const j = hi + n; if (j < 0 || j >= H.length) return;
  hi = j; const r = S.rot; S = clone(H[hi]); autoPre = null;
  if (S.rot !== r) prepare(); else schedule();
  buildUI(); ui();
}
$("un").onclick = () => go(-1);
$("re").onclick = () => go(1);
$("rs").onclick = () => { const r = S.rot; S = NEW(); autoPre = null; if (r) prepare(); else schedule(); buildUI(); commit(); };

/* slider: drag = fine control, tap beside the thumb = 2 points, double tap = default */
function slider(lo, hi_, def, get, set, done){
  const s = el("div", "sl"), th = el("i"); s.append(th); s.tabIndex = 0; s.setAttribute("role", "slider");
  s.setAttribute("aria-valuemin", lo); s.setAttribute("aria-valuemax", hi_);
  const pos = () => { th.style.left = (get() - lo) / (hi_ - lo) * 100 + "%"; s.setAttribute("aria-valuenow", get()); };
  const put = v => { set(Math.max(lo, Math.min(hi_, Math.round(v)))); pos(); };
  let d = null, last = 0;
  s.onpointerdown = e => {
    const r = s.getBoundingClientRect(), tx = (get() - lo) / (hi_ - lo) * r.width, x = e.clientX - r.left, now = Date.now();
    if (now - last < 320) { last = 0; d = null; put(def); done(); return; }
    last = now;
    d = {x0: e.clientX, v0: get(), w: r.width, near: Math.abs(x - tx) < 26 * K, dir: x > tx ? 1 : -1, moved: false};
    s.setPointerCapture(e.pointerId);
  };
  s.onpointermove = e => {
    if (!d) return; const dx = e.clientX - d.x0;
    if (Math.abs(dx) > 6) d.moved = true;
    if (d.moved) put(d.v0 + dx / d.w * (hi_ - lo));
  };
  s.onpointerup = () => { if (!d) return; if (!d.moved && !d.near) put(get() + d.dir * 2); d = null; done(); };
  s.onpointercancel = () => { d = null; };
  s.onkeydown = e => { const n = {ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[e.key]; if (n) { e.preventDefault(); put(get() + n); done(); } };

}
function fmt(o, k, lo){
  const n = S[o][k] || 0;
  if (k === "exposure") return (n >= 0 ? "+" : "") + (n / 100 * 3).toFixed(2);
  return (n > 0 && lo < 0 ? "+" : "") + n;
}
function row(o, k, name, lo, hi_, def){
  const r = el("div", "row"), lb = el("span", "lb"), val = el("span", "v"); lb.textContent = name;
  const sl = slider(lo, hi_, def, () => S[o][k] || 0, v => {
    S[o][k] = v; val.textContent = fmt(o, k, lo);
    if (o === "V" && autoPre) { autoPre = null; if (autoB) autoB.classList.remove("on"); }
    schedule();
  }, commit);
  val.textContent = fmt(o, k, lo); lb.onclick = sl.rs; r.append(lb, sl, val); return r;
}

/* UI */
function tbtn(icon, label, on, fn){ const b = el("button", "tb" + (on ? " on" : "")); b.innerHTML = svg(icon) + "<span>" + label + "</span>"; b.onclick = fn; return b; }
function chip(n, on, fn){ const b = el("button", "chip" + (on ? " on" : "")); b.textContent = n; b.onclick = fn; return b; }
function h2(t){ const h = el("h2"); h.textContent = t; return h; }
function buildUI(){
  const sub = $("sub"), panel = $("panel"), dock = $("dock");
  sub.innerHTML = panel.innerHTML = dock.innerHTML = ""; autoB = null;
  dock.append(
    tbtn("presets", "Presets", mode === "presets", () => { mode = "presets"; buildUI(); }),
    tbtn("rotate", "Rotate", false, () => { if (img) { S.rot = (S.rot + 1) % 4; prepare(); commit(); } }),
    tbtn("sliders", "Edit", mode === "edit", () => { mode = "edit"; buildUI(); })
  );
  if (mode === "presets") {
    sub.style.display = "none"; const d = el("div", "chips");
    Object.keys(PRESETS).forEach(n => d.append(chip(n, 0, () => { S.V = {...PRESETS[n]}; autoPre = null; schedule(); commit(); })));
    panel.append(d); return;
  }
  sub.style.display = "flex";
  autoB = tbtn("wand", "Auto", !!autoPre, autoAdjust); sub.append(autoB);
  Object.keys(TABS).forEach(t => sub.append(tbtn(TABS[t].ic, t, t === tab, () => { tab = t; buildUI(); schedule(); })));
  if (tab === "Mask") return maskUI(panel);
  panel.append(h2(TABS[tab].head)); TABS[tab].items.forEach(i => panel.append(row(...i)));
}
function maskUI(p){
  const m = S.m, c = el("div", "chips");
  [["off","Off"],["circle","Circle"],["draw","Draw"]].forEach(([t, n]) => c.append(chip(n, m.t === t, () => { S.m.t = t; commit(); buildUI(); schedule(); })));
  if (m.t === "draw") c.append(chip("Erase", m.er, () => { S.m.er = S.m.er ? 0 : 1; buildUI(); }), chip("Clear", 0, () => { S.st = []; commit(); schedule(); }));
  if (m.t !== "off") c.append(chip("Invert", m.inv, () => { S.m.inv = S.m.inv ? 0 : 1; commit(); buildUI(); schedule(); }));
  p.append(c);
  if (m.t === "off") { const n = el("p"); n.style.color = "var(--soft)"; n.textContent = "Choose Circle or Draw, then drag on the photo to place the mask. Edits below apply only inside it."; p.append(n); return; }
  p.append(row("m", "r", m.t === "draw" ? "Brush size" : "Size", 5, 100, 30), row("m", "f", "Shade", 0, 100, 50), h2("Inside the mask"));
  [["exposure","Exposure",-100,100],["contrast","Contrast",-100,100],["temp","Temp",-100,100],["sat","Saturation",-100,100],["blur","Blur",0,100]].forEach(([k, n, lo, hi_]) => p.append(row("L", k, n, lo, hi_, 0)));
}

function autoAdjust(){
  if (!baseData) return;
  if (autoPre) { S.V = autoPre; autoPre = null; }
  else {
    autoPre = {...S.V}; const d = baseData.data; let s = 0, n = 0;
    for (let i = 0; i < d.length; i += 16) { s += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255; n++; }
    const V = S.V; ["exposure","contrast","highlights","shadows","whites","blacks","temp","tint","vibrance","sat"].forEach(k => V[k] = 0);
    V.exposure = Math.max(-60, Math.min(60, Math.round((0.46 - s / n) * 200)));
    V.contrast = 10; V.highlights = -15; V.shadows = 15; V.vibrance = 15;
  }
  buildUI(); schedule(); commit();
}

/* image */
function makeBase(maxSide){
  const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight)), r = S.rot;
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s), c = el("canvas");
  c.width = r % 2 ? h : w; c.height = r % 2 ? w : h;
  const g = c.getContext("2d"); g.translate(c.width / 2, c.height / 2); g.rotate(r * Math.PI / 2); g.drawImage(img, -w / 2, -h / 2, w, h);
  return c;
}
function prepare(){
  base = makeBase(1000); baseData = base.getContext("2d").getImageData(0, 0, base.width, base.height);
  const v = $("view"); v.width = base.width; v.height = base.height; v.hidden = false; $("hist").hidden = false; $("empty").hidden = true;
  const t = el("canvas"); t.width = 48; t.height = Math.max(1, Math.round(48 * base.height / base.width));
  t.getContext("2d").drawImage(base, 0, 0, t.width, t.height);
  $("bg").style.backgroundImage = "url(" + t.toDataURL("image/jpeg", 0.7) + ")";
  schedule();
}

/* processing */
function lut(P){
  const g = k => (P[k] || 0) / 100, ev = g("exposure") * 3, co = g("contrast"), hi_ = g("highlights"), sh = g("shadows"), wh = g("whites"), bl = g("blacks");
  const L = new Uint8ClampedArray(256);
  for (let i = 0; i < 256; i++) {
    let x = Math.min(1, Math.pow(Math.pow(i / 255, 2.2) * Math.pow(2, ev), 1 / 2.2));
    x += sh * 1.6 * x * (1 - x) * (1 - x); x += hi_ * 1.6 * x * x * (1 - x); x += wh * 0.25 * x * x * x; x += bl * 0.25 * Math.pow(1 - x, 3);
    L[i] = ((x - 0.5) * (1 + co * 0.8) + 0.5) * 255;
  }
  return L;
}
function bb(d, w, h, r){
  r = Math.round(r); if (r < 1) return d;
  let a = d.slice(), b = new Uint8ClampedArray(d.length);
  for (let it = 0; it < 4; it++) {
    const p = it & 1, n = p ? h : w, m = p ? w : h, st = p ? w * 4 : 4, ls = p ? 4 : w * 4;
    for (let l = 0; l < m; l++) for (let c = 0; c < 3; c++) {
      const o = l * ls + c; let s = 0;
      for (let i = -r; i <= r; i++) s += a[o + Math.min(n - 1, Math.max(0, i)) * st];
      for (let i = 0; i < n; i++) { b[o + i * st] = s / (2 * r + 1); s += a[o + Math.min(n - 1, i + r + 1) * st] - a[o + Math.max(0, i - r) * st]; }
    }
    [a, b] = [b, a];
  }
  return a;
}
function proc(src, w, h, P){
  const g = k => P[k] || 0, wp = g("warp") / 100, wv = g("wave") / 100; let d = src.data;
  if (wp || wv) {
    const o = new Uint8ClampedArray(d.length);
    for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) {
      let u = x, v = y;
      if (wp) { const dx = x / w * 2 - 1, dy = y / h * 2 - 1, f = 1 - wp * .6 * (1 - Math.min(1, dx * dx + dy * dy)); u = w / 2 + (x - w / 2) * f; v = h / 2 + (y - h / 2) * f; }
      if (wv) { u += Math.sin(y / h * 25) * wv * .03 * w; v += Math.sin(x / w * 25) * wv * .03 * h; }
      u = Math.min(w - 1, Math.max(0, u)) | 0; v = Math.min(h - 1, Math.max(0, v)) | 0;
      const j = (v * w + u) * 4; o[i] = d[j]; o[i + 1] = d[j + 1]; o[i + 2] = d[j + 2]; o[i + 3] = 255;
    }
    d = o;
  }
  if (g("blur")) d = bb(d, w, h, g("blur") / 100 * w * .02);
  const vb = g("vb") / 100, Bd = vb ? bb(d, w, h, w * .03) : null, gr = g("grain") / 100, vig = g("vig") / 100;
  const L = lut(P), rm = 1 + .25 * g("temp") / 100, bm = 1 - .25 * g("temp") / 100, gm = 1 - .15 * g("tint") / 100;
  const sat = g("sat") / 100, vib = g("vibrance") / 100, out = new ImageData(w, h), o = out.data;
  for (let y = 0, i = 0; y < h; y++) {
    const dy = y / h * 2 - 1;
    for (let x = 0; x < w; x++, i += 4) {
      const dx = x / w * 2 - 1, r2 = dx * dx + dy * dy; let a = d[i], b = d[i + 1], c = d[i + 2];
      if (Bd) { const t = Math.min(1, Math.max(0, (Math.sqrt(r2) - .3) / .9)) * vb; a += (Bd[i] - a) * t; b += (Bd[i + 1] - b) * t; c += (Bd[i + 2] - c) * t; }
      let r = L[a | 0] * rm, gg = L[b | 0] * gm, bl = L[c | 0] * bm;
      if (sat || vib) {
        const l = 0.2126 * r + 0.7152 * gg + 0.0722 * bl, mx = Math.max(r, gg, bl), mn = Math.min(r, gg, bl), f = 1 + sat + vib * (1 - (mx - mn) / (mx + 1));
        r = l + (r - l) * f; gg = l + (gg - l) * f; bl = l + (bl - l) * f;
      }
      if (vig) { const m = 1 + vig * 0.45 * r2; r *= m; gg *= m; bl *= m; }
      if (gr) { const n = ((Math.imul(i, 2654435761) >>> 24) - 128) * gr * .6; r += n; gg += n; bl += n; }
      o[i] = r; o[i + 1] = gg; o[i + 2] = bl; o[i + 3] = 255;
    }
  }
  return out;
}

/* mask: one alpha map for circle and free draw */
let mc = {k: "", a: null};
function maskA(w, h){
  const m = S.m, k = w + JSON.stringify(m) + S.st.reduce((n, s) => n + s.p.length, 0);
  if (mc.k === k) return mc.a;
  const c = el("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"), mn = Math.min(w, h);
  const dot = (x, y, Rr, f, e) => {
    const gr = g.createRadialGradient(x, y, Rr * (1 - f), x, y, Rr); gr.addColorStop(0, "#fff"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.globalCompositeOperation = e ? "destination-out" : "source-over"; g.fillStyle = gr; g.fillRect(x - Rr, y - Rr, Rr * 2, Rr * 2);
  };
  if (m.t === "circle") dot(m.cx * w, m.cy * h, m.r / 100 * .7 * mn, m.f / 100, 0);
  if (m.t === "draw") S.st.forEach(s => {
    const Rr = s.r / 100 * .2 * mn, f = s.f / 100; let px = null, py = 0;
    for (let i = 0; i < s.p.length; i += 2) {
      const x = s.p[i] * w, y = s.p[i + 1] * h;
      if (px === null) dot(x, y, Rr, f, s.e);
      else { const n = Math.max(1, Math.ceil(Math.hypot(x - px, y - py) / (Rr * .25))); for (let j = 1; j <= n; j++) dot(px + (x - px) * j / n, py + (y - py) * j / n, Rr, f, s.e); }
      px = x; py = y;
    }
  });
  const dd = g.getImageData(0, 0, w, h).data, a = new Uint8Array(w * h);
  for (let p = 0; p < a.length; p++) a[p] = dd[p * 4 + 3];
  mc = {k, a}; return a;
}
function pipe(src, w, h){
  const out = proc(src, w, h, S.V);
  if (S.m.t !== "off" && Object.values(S.L).some(Boolean)) {
    const a = maskA(w, h), l = proc(out, w, h, S.L).data, o = out.data, inv = S.m.inv;
    for (let p = 0, i = 0; p < a.length; p++, i += 4) {
      const k = (inv ? 255 - a[p] : a[p]) / 255;
      if (k) { o[i] += (l[i] - o[i]) * k; o[i + 1] += (l[i + 1] - o[i + 1]) * k; o[i + 2] += (l[i + 2] - o[i + 2]) * k; }
    }
  }
  return out;
}

function schedule(){ if (!queued && img) { queued = true; requestAnimationFrame(render); } }
function render(){
  queued = false;
  const data = showOrig ? baseData : pipe(baseData, base.width, base.height), g = $("view").getContext("2d"), editing = tab === "Mask" && S.m.t !== "off" && mode === "edit";
  g.putImageData(data, 0, 0); $("view").style.touchAction = editing ? "none" : "";
  if (editing && !showOrig) {
    const w = base.width, h = base.height, a = maskA(w, h), o = new ImageData(w, h), t = el("canvas");
    for (let p = 0; p < a.length; p++) { o.data[p * 4] = 255; o.data[p * 4 + 1] = 60; o.data[p * 4 + 2] = 100; o.data[p * 4 + 3] = (S.m.inv ? 255 - a[p] : a[p]) * .5; }
    t.width = w; t.height = h; t.getContext("2d").putImageData(o, 0, 0); g.drawImage(t, 0, 0);
  }
  hist(data.data);
}
function hist(d){
  const B = [new Array(64).fill(0), new Array(64).fill(0), new Array(64).fill(0)];
  for (let i = 0; i < d.length; i += 16) for (let c = 0; c < 3; c++) B[c][d[i + c] >> 2]++;
  const g = $("hist").getContext("2d"), cols = ["rgba(255,70,70,.7)", "rgba(70,230,90,.7)", "rgba(80,130,255,.7)"];
  g.clearRect(0, 0, 256, 44); g.globalCompositeOperation = "lighter";
  B.forEach((b, c) => {
    const mx = Math.max(...b) || 1; g.beginPath(); g.moveTo(0, 44);
    for (let i = 0; i < 64; i++) g.lineTo(i * 4, 42 - b[i] / mx * 38);
    g.lineTo(252, 44); g.closePath(); g.fillStyle = cols[c]; g.fill();
  });
  g.globalCompositeOperation = "source-over";
}

/* drag on the photo to place or paint the mask */
const cv = $("view"); let down = false, cur = null;
function pt(e){
  const r = cv.getBoundingClientRect(), s = Math.min(r.width / cv.width, r.height / cv.height), w = cv.width * s, h = cv.height * s;
  return [(e.clientX - r.left - (r.width - w) / 2) / w, (e.clientY - r.top - (r.height - h) / 2) / h];
}
function paint(e){
  const [x, y] = pt(e);
  if (S.m.t === "circle") { S.m.cx = x; S.m.cy = y; } else if (cur) cur.p.push(x, y);
  schedule();
}
cv.onpointerdown = e => {
  if (tab !== "Mask" || mode !== "edit" || S.m.t === "off" || !img) return;
  down = true; cv.setPointerCapture(e.pointerId);
  if (S.m.t === "draw") { const [x, y] = pt(e); cur = {p: [x, y], r: S.m.r, f: S.m.f, e: S.m.er}; S.st.push(cur); schedule(); } else paint(e);
};
cv.onpointermove = e => { if (down) paint(e); };
cv.onpointerup = cv.onpointercancel = () => { if (down) { down = false; cur = null; commit(); } };

/* files, compare, export */
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      img = im; S = NEW(); autoPre = null; H = [clone(S)]; hi = 0; mc = {k: "", a: null};
      $("cmp").disabled = false; $("save").disabled = false; prepare(); buildUI(); ui();
      $("note").textContent = f.name + " (" + im.naturalWidth + " × " + im.naturalHeight + ")";
    };
    im.onerror = () => $("note").textContent = "That file could not be opened as an image.";
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
};
const cmp = $("cmp");
cmp.addEventListener("pointerdown", () => { showOrig = true; schedule(); });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => cmp.addEventListener(ev, () => { if (showOrig) { showOrig = false; schedule(); } }));
$("help").onclick = () => $("note").textContent = "Drag a slider to fine-tune, tap beside the thumb to move 2 points, double tap to reset it. Back and Forward step through your edits. Auto toggles on and off. Hold the clock to compare. The check saves or shares the full-size photo.";

$("save").onclick = async () => {
  $("note").textContent = "Processing full size…";
  await new Promise(r => setTimeout(r, 30));
  try {
    const fc = makeBase(3000), fg = fc.getContext("2d");
    fg.putImageData(pipe(fg.getImageData(0, 0, fc.width, fc.height), fc.width, fc.height), 0, 0);
    const blob = await new Promise(r => fc.toBlob(r, "image/jpeg", 0.92));
    const file = new File([blob], "photo-" + Date.now() + ".jpg", {type: "image/jpeg"});
    $("out").src = fc.toDataURL("image/jpeg", 0.92); $("out").style.display = "block";
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file]}); $("note").textContent = "Exported at " + fc.width + " × " + fc.height + "."; }
    else $("note").textContent = "Sharing is not available here. Press and hold the photo below and choose to download it.";
  } catch (e) { $("note").textContent = "Export did not finish: " + e.name; }
};

/* desktop-site mode on a phone renders the page tiny: scale the whole UI up to fit */
function fit(){
  const a = $("app"), sw = Math.min(screen.width, screen.height), iw = innerWidth;
  K = sw < 700 && iw > sw * 1.1 ? Math.min(3, iw / 320) : 1;
  a.style.cssText = K > 1 ? "width:" + iw / K + "px;height:" + innerHeight / K + "px;max-width:none;margin:0;transform:scale(" + K + ");transform-origin:0 0" : "";
}
addEventListener("resize", fit); fit(); buildUI();
</script>
